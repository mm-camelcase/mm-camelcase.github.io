<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camelcase — Brutalist Prototype</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

const BLACK = '#000000';
const WHITE = '#ffffff';
const ACCENT = '#ff3b00';
const GREY = '#888888';

const SUGGESTED_PROMPTS = [
  "What's Mark's experience with Kubernetes?",
  "Is Mark available for contract work?",
  "Tell me about Mark's security experience",
  "Upload a job spec for analysis",
];

const MOCK_RESPONSES = {
  "What's Mark's experience with Kubernetes?":
    "I've been working with Kubernetes for several years, most recently focused on **GPU workload optimisation** at an AI startup. I built a cost optimisation system that reduced GPU compute spend by **40%**. I also designed self-service dev environments on K8s for the engineering team.\n\nMy K8s work spans EKS, Helm, custom operators, and cost governance tooling.",
  "Is Mark available for contract work?":
    "Yes — I'm open to both contract and permanent roles. I'm based in Ireland and work remotely. I'm particularly interested in roles involving **AI platform engineering**, DevOps for AI/ML workloads, or building **agentic systems**.\n\nBest way to discuss specifics is to reach out directly at mark@camelcase.club.",
  "Tell me about Mark's security experience":
    "Security is a core part of my work. I've led **SOC2** and **ISO 27001** compliance automation, building policy-as-code frameworks that turned manual audit processes into automated checks.\n\nAt my current role, I handle information security alongside platform engineering — so I see both sides: building secure infrastructure and proving compliance.",
  "Upload a job spec for analysis":
    "## Suitability Analysis\n**Match Score: 85/100**\n\n**Strong alignment:**\n- Kubernetes & container orchestration\n- AWS infrastructure & Terraform\n- CI/CD & platform engineering\n- Security & compliance (SOC2, ISO 27001)\n\n**Gaps to discuss:**\n- No specific experience with GCP (AWS-focused)\n\n**Suggested questions for Mark:**\n- How did you approach GPU cost optimisation at scale?\n- What was your SOC2 compliance automation strategy?",
  default:
    "Thanks for your question. I can help with anything about Mark's experience, skills, availability, or how he works. You can also upload a job spec and I'll give you a detailed suitability analysis.\n\nWhat would you like to know?",
};

function getResponse(msg) {
  const lower = msg.toLowerCase();
  if (lower.includes('kubernetes') || lower.includes('k8s')) return MOCK_RESPONSES["What's Mark's experience with Kubernetes?"];
  if (lower.includes('available') || lower.includes('contract') || lower.includes('hire')) return MOCK_RESPONSES["Is Mark available for contract work?"];
  if (lower.includes('security') || lower.includes('compliance') || lower.includes('soc2')) return MOCK_RESPONSES["Tell me about Mark's security experience"];
  if (lower.includes('job spec') || lower.includes('upload') || lower.includes('suitability')) return MOCK_RESPONSES["Upload a job spec for analysis"];
  return MOCK_RESPONSES.default;
}

function renderMarkdown(text) {
  return text.split('\n').map((line, i) => {
    const parts = line.split(/(\*\*[^*]+\*\*)/g).map((part, j) => {
      if (part.startsWith('**') && part.endsWith('**')) {
        return <strong key={j} style={{ fontWeight: 700, textDecoration: 'underline', textDecorationColor: ACCENT, textUnderlineOffset: '3px' }}>{part.slice(2, -2)}</strong>;
      }
      return part;
    });
    return <div key={i} style={{ minHeight: line === '' ? '0.6em' : 'auto' }}>{parts}</div>;
  });
}

function BrutalistPrototype() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const messagesEndRef = useRef(null);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, isTyping]);

  const sendMessage = (text) => {
    const userMsg = text || input;
    if (!userMsg.trim()) return;
    setMessages((prev) => [...prev, { role: 'user', content: userMsg }]);
    setInput('');
    setIsTyping(true);
    setTimeout(() => {
      setMessages((prev) => [...prev, { role: 'agent', content: getResponse(userMsg) }]);
      setIsTyping(false);
    }, 1200);
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  };

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: ${WHITE}; color: ${BLACK}; font-family: 'Space Mono', monospace; }
        ::selection { background: ${BLACK}; color: ${WHITE}; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      `}</style>

      <section style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', border: `3px solid ${BLACK}` }}>
        <header style={{
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          padding: '1rem 2rem', borderBottom: `3px solid ${BLACK}`,
        }}>
          <span style={{ fontFamily: "'Syne', sans-serif", fontSize: '1.2rem', fontWeight: 800, textTransform: 'uppercase' }}>Camelcase.club</span>
          <span style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Mark Mitchell — DevOps & InfoSec</span>
        </header>

        <div style={{ padding: '2rem 2rem 0', borderBottom: `3px solid ${BLACK}` }}>
          <h1 style={{
            fontFamily: "'Syne', sans-serif", fontSize: 'clamp(2.5rem, 8vw, 6rem)',
            fontWeight: 800, lineHeight: 0.95, textTransform: 'uppercase',
            letterSpacing: '-0.02em', paddingBottom: '1.5rem',
          }}>
            Build more<br />
            <span style={{ WebkitTextStroke: `2px ${BLACK}`, color: 'transparent' }}>with less</span>
          </h1>
        </div>

        <div style={{
          padding: '0.75rem 2rem', borderBottom: `3px solid ${BLACK}`,
          background: BLACK, color: WHITE, fontSize: '0.8rem', textTransform: 'uppercase',
          letterSpacing: '0.15em', overflow: 'hidden', whiteSpace: 'nowrap',
        }}>
          <div style={{ display: 'inline-block', animation: 'marquee 20s linear infinite' }}>
            AI-Augmented DevOps &nbsp;&nbsp;/&nbsp;&nbsp; Platform Engineering &nbsp;&nbsp;/&nbsp;&nbsp; Agentic Systems &nbsp;&nbsp;/&nbsp;&nbsp; LLM Observability &nbsp;&nbsp;/&nbsp;&nbsp; Cost Optimisation &nbsp;&nbsp;/&nbsp;&nbsp;
            AI-Augmented DevOps &nbsp;&nbsp;/&nbsp;&nbsp; Platform Engineering &nbsp;&nbsp;/&nbsp;&nbsp; Agentic Systems &nbsp;&nbsp;/&nbsp;&nbsp; LLM Observability &nbsp;&nbsp;/&nbsp;&nbsp; Cost Optimisation &nbsp;&nbsp;/&nbsp;&nbsp;
          </div>
        </div>

        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: '400px' }}>
          <div style={{ flex: 1, overflowY: 'auto', padding: '2rem', display: 'flex', flexDirection: 'column', gap: '1.5rem', maxHeight: '50vh' }}>
            {messages.length === 0 && !isTyping && (
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: '2rem' }}>
                <p style={{ fontSize: '1.1rem', fontFamily: "'Syne', sans-serif", fontWeight: 600 }}>ASK THE AGENT.</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem' }}>
                  {SUGGESTED_PROMPTS.map((prompt, i) => (
                    <button key={i} onClick={() => sendMessage(prompt)} style={{
                      background: WHITE, border: `2px solid ${BLACK}`, borderRadius: 0,
                      padding: '0.6rem 1rem', color: BLACK, fontSize: '0.75rem',
                      fontFamily: "'Space Mono', monospace", cursor: 'pointer',
                      textTransform: 'uppercase', letterSpacing: '0.05em', transition: 'all 0.15s',
                    }}
                    onMouseEnter={(e) => { e.target.style.background = BLACK; e.target.style.color = WHITE; }}
                    onMouseLeave={(e) => { e.target.style.background = WHITE; e.target.style.color = BLACK; }}
                    >
                      {prompt}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {messages.map((msg, i) => (
              <div key={i}>
                {msg.role === 'user' ? (
                  <div style={{
                    background: BLACK, color: WHITE, padding: '1rem',
                    fontSize: '0.9rem', lineHeight: 1.5, fontWeight: 700, textTransform: 'uppercase',
                  }}>
                    {msg.content}
                  </div>
                ) : (
                  <div style={{
                    padding: '1rem', borderLeft: `4px solid ${ACCENT}`,
                    fontSize: '0.9rem', lineHeight: 1.7, color: '#333',
                  }}>
                    {renderMarkdown(msg.content)}
                  </div>
                )}
              </div>
            ))}

            {isTyping && (
              <div style={{
                padding: '1rem', borderLeft: `4px solid ${ACCENT}`,
                fontSize: '0.85rem', textTransform: 'uppercase', color: GREY,
              }}>
                Thinking...
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          <div style={{ padding: '1rem 2rem', borderTop: `3px solid ${BLACK}`, display: 'flex', gap: '0' }}>
            <input
              type="text" value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="TYPE YOUR QUESTION"
              style={{
                flex: 1, background: 'transparent', border: `2px solid ${BLACK}`,
                borderRight: 'none', outline: 'none', padding: '0.85rem 1rem',
                color: BLACK, fontSize: '0.85rem', fontFamily: "'Space Mono', monospace", textTransform: 'uppercase',
              }}
              aria-label="Chat input"
            />
            <label style={{
              display: 'flex', alignItems: 'center', padding: '0 1rem',
              border: `2px solid ${BLACK}`, borderRight: 'none',
              fontSize: '0.7rem', textTransform: 'uppercase', cursor: 'pointer', fontFamily: "'Space Mono', monospace",
            }}>
              File
              <input type="file" accept=".md,.txt,.pdf" style={{ display: 'none' }} aria-label="Upload job spec" />
            </label>
            <button onClick={() => sendMessage()} style={{
              background: BLACK, border: `2px solid ${BLACK}`, padding: '0.85rem 2rem',
              color: WHITE, fontSize: '0.85rem', fontWeight: 700, cursor: 'pointer',
              fontFamily: "'Space Mono', monospace", textTransform: 'uppercase',
            }}>
              Send
            </button>
          </div>
        </div>
      </section>

      <section style={{ border: `3px solid ${BLACK}`, borderTop: 'none' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))' }}>
          {['AI-Augmented Platform Engineering', 'Agentic AI Systems', 'Cost-Efficient AI Workloads', 'LLM Observability', 'Dev Productivity & Upskilling'].map((item, i) => (
            <div key={i} style={{ padding: '2rem 1.5rem', borderRight: `3px solid ${BLACK}`, borderBottom: `3px solid ${BLACK}` }}>
              <span style={{ fontFamily: "'Syne', sans-serif", fontSize: '1.1rem', fontWeight: 700, textTransform: 'uppercase', lineHeight: 1.2, display: 'block' }}>{item}</span>
            </div>
          ))}
        </div>

        <div style={{ borderBottom: `3px solid ${BLACK}` }}>
          <div style={{
            padding: '1rem 2rem', background: BLACK, color: WHITE,
            fontFamily: "'Syne', sans-serif", fontSize: '0.85rem', fontWeight: 800,
            textTransform: 'uppercase', letterSpacing: '0.15em',
          }}>
            Selected Work
          </div>
          {[
            { title: 'Agentic Weather API with MCP', desc: 'Model Context Protocol server. LLMs meet real-time weather data. Tool-use patterns for agentic systems.' },
            { title: 'GPU Cost Optimisation on K8s', desc: '40% compute savings. Spot instances, workload scheduling, cost governance.' },
            { title: 'SOC2 Compliance Automation', desc: 'Manual audits → policy-as-code. Automated evidence collection. Audit-ready dashboards.' },
          ].map((item, i) => (
            <div key={i} style={{
              padding: '1.5rem 2rem', borderBottom: '1px solid #ddd',
              display: 'grid', gridTemplateColumns: '1fr 2fr', gap: '2rem', alignItems: 'start',
            }}>
              <h3 style={{ fontFamily: "'Syne', sans-serif", fontSize: '1rem', fontWeight: 700, textTransform: 'uppercase' }}>{item.title}</h3>
              <p style={{ fontSize: '0.85rem', lineHeight: 1.6, color: '#444' }}>{item.desc}</p>
            </div>
          ))}
        </div>

        <div style={{
          padding: '3rem 2rem', borderBottom: `3px solid ${BLACK}`,
          display: 'grid', gridTemplateColumns: '1fr 2fr', gap: '2rem', alignItems: 'start',
        }}>
          <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: '1.5rem', fontWeight: 800, textTransform: 'uppercase' }}>How I<br />Work</h2>
          <p style={{ fontSize: '0.95rem', lineHeight: 1.8, maxWidth: '550px' }}>
            AI tools daily. Claude Code for IaC, code review, diagnostics. AI-augmented, not AI-dependent.
            Every PR human-reviewed. Every architecture decision mine. Faster shipping. Higher quality.
          </p>
        </div>

        <div style={{ padding: '2rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
          <div style={{ display: 'flex', gap: '2rem', fontSize: '0.85rem', textTransform: 'uppercase' }}>
            <a href="mailto:mark@camelcase.club" style={{ color: BLACK, textDecoration: 'none' }}>Email</a>
            <a href="https://github.com/mm-camelcase" style={{ color: BLACK, textDecoration: 'none' }}>GitHub</a>
            <a href="#" style={{ color: BLACK, textDecoration: 'none' }}>LinkedIn</a>
          </div>
          <span style={{ background: ACCENT, color: WHITE, padding: '0.4rem 1rem', fontSize: '0.75rem', fontWeight: 700, textTransform: 'uppercase' }}>Available Now</span>
        </div>
      </section>

      <footer style={{ padding: '1.5rem 2rem', textAlign: 'center', fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.1em', color: GREY }}>
        Camelcase Ltd. — {new Date().getFullYear()}
      </footer>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(BrutalistPrototype));
  </script>
</body>
</html>
