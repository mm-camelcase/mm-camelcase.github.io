<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camelcase — Ambient Prototype</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

const BG = '#0c0e1a';
const SURFACE = 'rgba(255, 255, 255, 0.04)';
const GLASS = 'rgba(255, 255, 255, 0.06)';
const GLASS_BORDER = 'rgba(255, 255, 255, 0.08)';
const TEXT = '#e8eaf0';
const TEXT_DIM = '#7a7f9a';
const ACCENT = '#60a5fa';
const GLOW = 'rgba(96, 165, 250, 0.15)';
const WHITE = '#ffffff';

const SUGGESTED_PROMPTS = [
  "What's Mark's experience with Kubernetes?",
  "Is Mark available for contract work?",
  "Tell me about Mark's security experience",
  "Upload a job spec for analysis",
];

const MOCK_RESPONSES = {
  "What's Mark's experience with Kubernetes?":
    "I've been working with Kubernetes for several years, most recently focused on **GPU workload optimisation** at an AI startup. I built a cost optimisation system that reduced GPU compute spend by **40%**. I also designed self-service dev environments on K8s for the engineering team.\n\nMy K8s work spans EKS, Helm, custom operators, and cost governance tooling.",
  "Is Mark available for contract work?":
    "Yes — I'm open to both contract and permanent roles. I'm based in Ireland and work remotely. I'm particularly interested in roles involving **AI platform engineering**, DevOps for AI/ML workloads, or building **agentic systems**.\n\nBest way to discuss specifics is to reach out directly at mark@camelcase.club.",
  "Tell me about Mark's security experience":
    "Security is a core part of my work. I've led **SOC2** and **ISO 27001** compliance automation, building policy-as-code frameworks that turned manual audit processes into automated checks.\n\nAt my current role, I handle information security alongside platform engineering — so I see both sides: building secure infrastructure and proving compliance.",
  "Upload a job spec for analysis":
    "## Suitability Analysis\n**Match Score: 85/100**\n\n**Strong alignment:**\n- Kubernetes & container orchestration\n- AWS infrastructure & Terraform\n- CI/CD & platform engineering\n- Security & compliance (SOC2, ISO 27001)\n\n**Gaps to discuss:**\n- No specific experience with GCP (AWS-focused)\n\n**Suggested questions for Mark:**\n- How did you approach GPU cost optimisation at scale?\n- What was your SOC2 compliance automation strategy?",
  default:
    "Thanks for your question. I can help with anything about Mark's experience, skills, availability, or how he works. You can also upload a job spec and I'll give you a detailed suitability analysis.\n\nWhat would you like to know?",
};

function getResponse(msg) {
  const lower = msg.toLowerCase();
  if (lower.includes('kubernetes') || lower.includes('k8s')) return MOCK_RESPONSES["What's Mark's experience with Kubernetes?"];
  if (lower.includes('available') || lower.includes('contract') || lower.includes('hire')) return MOCK_RESPONSES["Is Mark available for contract work?"];
  if (lower.includes('security') || lower.includes('compliance') || lower.includes('soc2')) return MOCK_RESPONSES["Tell me about Mark's security experience"];
  if (lower.includes('job spec') || lower.includes('upload') || lower.includes('suitability')) return MOCK_RESPONSES["Upload a job spec for analysis"];
  return MOCK_RESPONSES.default;
}

function renderMarkdown(text) {
  return text.split('\n').map((line, i) => {
    const parts = line.split(/(\*\*[^*]+\*\*)/g).map((part, j) => {
      if (part.startsWith('**') && part.endsWith('**')) {
        return <strong key={j} style={{ color: ACCENT, fontWeight: 600 }}>{part.slice(2, -2)}</strong>;
      }
      return part;
    });
    return <div key={i} style={{ minHeight: line === '' ? '0.6em' : 'auto' }}>{parts}</div>;
  });
}

function FloatingGrid() {
  return (
    <div style={{
      position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, pointerEvents: 'none', zIndex: 0,
      opacity: 0.3,
      backgroundImage: `
        linear-gradient(rgba(96, 165, 250, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.03) 1px, transparent 1px)
      `,
      backgroundSize: '80px 80px',
    }} />
  );
}

function GradientOrb({ top, left, size, color }) {
  return (
    <div style={{
      position: 'fixed', top, left, width: size, height: size,
      borderRadius: '50%', background: color, filter: 'blur(120px)',
      pointerEvents: 'none', zIndex: 0, opacity: 0.4,
    }} />
  );
}

function AmbientPrototype() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [isTyping, setIsTyping] = useState(false);
  const messagesEndRef = useRef(null);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, isTyping]);

  const sendMessage = (text) => {
    const userMsg = text || input;
    if (!userMsg.trim()) return;
    setMessages((prev) => [...prev, { role: 'user', content: userMsg }]);
    setInput('');
    setIsTyping(true);
    setTimeout(() => {
      setMessages((prev) => [...prev, { role: 'agent', content: getResponse(userMsg) }]);
      setIsTyping(false);
    }, 1800);
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  };

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: ${BG}; color: ${TEXT}; font-family: 'Outfit', sans-serif; }
        ::selection { background: ${ACCENT}; color: ${BG}; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        @keyframes glow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      `}</style>

      <FloatingGrid />
      <GradientOrb top="-10%" left="-5%" size="500px" color="rgba(96, 165, 250, 0.08)" />
      <GradientOrb top="40%" left="70%" size="400px" color="rgba(139, 92, 246, 0.06)" />
      <GradientOrb top="80%" left="20%" size="350px" color="rgba(20, 184, 166, 0.05)" />

      <section style={{
        position: 'relative', zIndex: 1, minHeight: '100vh',
        display: 'flex', flexDirection: 'column',
        maxWidth: '1100px', margin: '0 auto', padding: '2.5rem 2rem',
      }}>
        <header style={{
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          marginBottom: '4rem', animation: 'fadeIn 0.6s ease-out',
        }}>
          <span style={{ fontSize: '1rem', fontWeight: 600, letterSpacing: '0.02em' }}>
            camelcase<span style={{ color: ACCENT }}>.club</span>
          </span>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.8rem', color: TEXT_DIM }}>
            <span style={{
              width: 6, height: 6, borderRadius: '50%', background: '#34d399',
              boxShadow: '0 0 8px rgba(52, 211, 153, 0.5)',
              animation: 'glow 2s ease-in-out infinite',
            }} />
            Agent Online
          </div>
        </header>

        <div style={{ marginBottom: '3rem', animation: 'fadeIn 0.8s ease-out 0.1s both' }}>
          <h1 style={{
            fontSize: 'clamp(1.8rem, 4.5vw, 3.2rem)', fontWeight: 700,
            lineHeight: 1.2, marginBottom: '1.25rem',
            background: `linear-gradient(135deg, ${TEXT} 0%, ${ACCENT} 100%)`,
            WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text',
          }}>
            I help startups build more with less
          </h1>
          <p style={{ fontSize: '1.1rem', color: TEXT_DIM, lineHeight: 1.6, maxWidth: '600px', fontWeight: 300 }}>
            AI-augmented DevOps, platform engineering, and agentic systems.
            Start a conversation — or upload a job spec.
          </p>
        </div>

        <div style={{
          flex: 1, display: 'flex', flexDirection: 'column',
          minHeight: '420px', maxHeight: '55vh',
          background: GLASS, border: `1px solid ${GLASS_BORDER}`,
          borderRadius: '16px', backdropFilter: 'blur(20px)',
          boxShadow: `0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 ${GLASS_BORDER}`,
          animation: 'fadeIn 0.8s ease-out 0.2s both', overflow: 'hidden',
        }}>
          <div style={{ flex: 1, overflowY: 'auto', padding: '2rem', display: 'flex', flexDirection: 'column', gap: '1.25rem' }}>
            {messages.length === 0 && !isTyping && (
              <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', flex: 1, gap: '2rem' }}>
                <div style={{
                  width: 48, height: 48, borderRadius: '50%',
                  background: `linear-gradient(135deg, ${ACCENT}, #a78bfa)`,
                  opacity: 0.7, animation: 'float 4s ease-in-out infinite',
                }} />
                <p style={{ fontSize: '1rem', color: TEXT_DIM, textAlign: 'center', maxWidth: '400px', lineHeight: 1.6, fontWeight: 300 }}>
                  20 years of engineering experience, ready to answer your questions.
                </p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.5rem', justifyContent: 'center' }}>
                  {SUGGESTED_PROMPTS.map((prompt, i) => (
                    <button key={i} onClick={() => sendMessage(prompt)} style={{
                      background: SURFACE, border: `1px solid ${GLASS_BORDER}`,
                      borderRadius: '24px', padding: '0.55rem 1.15rem',
                      color: TEXT_DIM, fontSize: '0.85rem', cursor: 'pointer',
                      fontFamily: "'Outfit', sans-serif", transition: 'all 0.3s',
                      backdropFilter: 'blur(10px)',
                    }}
                    onMouseEnter={(e) => {
                      e.target.style.borderColor = ACCENT;
                      e.target.style.color = ACCENT;
                      e.target.style.boxShadow = `0 0 16px ${GLOW}`;
                    }}
                    onMouseLeave={(e) => {
                      e.target.style.borderColor = GLASS_BORDER;
                      e.target.style.color = TEXT_DIM;
                      e.target.style.boxShadow = 'none';
                    }}
                    >
                      {prompt}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {messages.map((msg, i) => (
              <div key={i} style={{
                maxWidth: '85%', alignSelf: msg.role === 'user' ? 'flex-end' : 'flex-start',
                animation: 'fadeIn 0.3s ease-out',
              }}>
                {msg.role === 'user' ? (
                  <div style={{
                    background: `linear-gradient(135deg, ${ACCENT}, #818cf8)`,
                    borderRadius: '16px 16px 4px 16px', padding: '0.85rem 1.15rem',
                    fontSize: '0.95rem', lineHeight: 1.5, color: WHITE,
                  }}>
                    {msg.content}
                  </div>
                ) : (
                  <div style={{
                    background: SURFACE, border: `1px solid ${GLASS_BORDER}`,
                    borderRadius: '4px 16px 16px 16px', padding: '1rem 1.25rem',
                    fontSize: '0.95rem', lineHeight: 1.7, color: '#c4c8d8',
                    backdropFilter: 'blur(10px)',
                  }}>
                    {renderMarkdown(msg.content)}
                  </div>
                )}
              </div>
            ))}

            {isTyping && (
              <div style={{
                alignSelf: 'flex-start', background: SURFACE,
                border: `1px solid ${GLASS_BORDER}`, borderRadius: '4px 16px 16px 16px',
                padding: '0.85rem 1.25rem', display: 'flex', gap: '6px',
              }}>
                {[0, 1, 2].map((i) => (
                  <span key={i} style={{
                    width: 7, height: 7, borderRadius: '50%',
                    background: ACCENT, opacity: 0.4,
                    animation: `glow 1.4s ease-in-out ${i * 0.15}s infinite`,
                  }} />
                ))}
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          <div style={{
            padding: '1rem 1.5rem', borderTop: `1px solid ${GLASS_BORDER}`,
            display: 'flex', gap: '0.75rem', alignItems: 'center',
            background: 'rgba(0,0,0,0.15)',
          }}>
            <input
              type="text" value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Ask about experience, skills, or availability..."
              style={{
                flex: 1, background: 'transparent', border: 'none', outline: 'none',
                color: TEXT, fontSize: '0.95rem', fontFamily: "'Outfit', sans-serif", fontWeight: 300,
              }}
              aria-label="Chat input"
            />
            <label style={{
              padding: '0.45rem 0.85rem', border: `1px solid ${GLASS_BORDER}`,
              borderRadius: '8px', fontSize: '0.8rem', color: TEXT_DIM, cursor: 'pointer', transition: 'all 0.2s',
            }}>
              Upload
              <input type="file" accept=".md,.txt,.pdf" style={{ display: 'none' }} aria-label="Upload job spec" />
            </label>
            <button onClick={() => sendMessage()} style={{
              background: `linear-gradient(135deg, ${ACCENT}, #818cf8)`,
              border: 'none', borderRadius: '8px', padding: '0.5rem 1.25rem',
              color: WHITE, fontSize: '0.85rem', fontWeight: 500, cursor: 'pointer',
              fontFamily: "'Outfit', sans-serif",
              boxShadow: `0 4px 12px ${GLOW}`, transition: 'all 0.2s',
            }}>
              Send
            </button>
          </div>
        </div>
      </section>

      <section style={{ position: 'relative', zIndex: 1, maxWidth: '1100px', margin: '0 auto', padding: '5rem 2rem' }}>
        <div style={{ marginBottom: '5rem' }}>
          <h2 style={{ fontSize: '0.8rem', fontWeight: 500, color: ACCENT, textTransform: 'uppercase', letterSpacing: '0.15em', marginBottom: '2rem' }}>Capabilities</h2>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1rem' }}>
            {[
              { title: 'AI-Augmented Platform Engineering', desc: 'Kubernetes, Terraform, CI/CD — with AI accelerating every step of the process.' },
              { title: 'Agentic AI Systems', desc: 'Building AI agents that do real work. RAG, tool use, orchestration, and evaluation.' },
              { title: 'Cost-Efficient AI Workloads', desc: 'GPU optimisation, spot instances, cost governance. 40% compute savings delivered.' },
              { title: 'LLM Observability', desc: 'Langfuse, distributed tracing, prompt versioning, cost-per-query dashboards.' },
              { title: 'Dev Productivity & Upskilling', desc: 'Shipping faster with AI-augmented workflows. Coaching teams to adopt the same.' },
            ].map((item, i) => (
              <div key={i} style={{
                padding: '1.5rem', background: GLASS, border: `1px solid ${GLASS_BORDER}`,
                borderRadius: '12px', backdropFilter: 'blur(10px)', transition: 'all 0.3s',
              }}>
                <h3 style={{ fontSize: '1rem', fontWeight: 600, marginBottom: '0.5rem' }}>{item.title}</h3>
                <p style={{ fontSize: '0.9rem', color: TEXT_DIM, lineHeight: 1.6, fontWeight: 300 }}>{item.desc}</p>
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginBottom: '5rem' }}>
          <h2 style={{ fontSize: '0.8rem', fontWeight: 500, color: ACCENT, textTransform: 'uppercase', letterSpacing: '0.15em', marginBottom: '2rem' }}>Selected Work</h2>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
            {[
              { title: 'Agentic Weather API with MCP', desc: 'Model Context Protocol server connecting LLMs to real-time weather data. Demonstrates tool-use patterns for agentic systems.' },
              { title: 'GPU Cost Optimisation on K8s', desc: 'Reduced GPU compute spend by 40% through spot instance orchestration, workload scheduling, and custom cost governance tooling.' },
              { title: 'SOC2 Compliance Automation', desc: 'Replaced manual audit workflows with policy-as-code. Automated evidence collection, continuous monitoring, audit-ready dashboards.' },
            ].map((item, i) => (
              <div key={i} style={{
                padding: '1.5rem', background: GLASS, border: `1px solid ${GLASS_BORDER}`,
                borderRadius: '12px', backdropFilter: 'blur(10px)',
                display: 'flex', gap: '1.5rem', alignItems: 'flex-start',
              }}>
                <div style={{
                  width: 4, minHeight: '100%', borderRadius: '2px', flexShrink: 0,
                  background: `linear-gradient(180deg, ${ACCENT}, transparent)`,
                }} />
                <div>
                  <h3 style={{ fontSize: '1.05rem', fontWeight: 600, marginBottom: '0.5rem' }}>{item.title}</h3>
                  <p style={{ fontSize: '0.9rem', color: TEXT_DIM, lineHeight: 1.7, fontWeight: 300 }}>{item.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginBottom: '5rem' }}>
          <h2 style={{ fontSize: '0.8rem', fontWeight: 500, color: ACCENT, textTransform: 'uppercase', letterSpacing: '0.15em', marginBottom: '2rem' }}>How I Work</h2>
          <div style={{
            padding: '2rem', background: GLASS, border: `1px solid ${GLASS_BORDER}`,
            borderRadius: '12px', backdropFilter: 'blur(10px)',
          }}>
            <p style={{ fontSize: '1.05rem', lineHeight: 1.85, color: TEXT_DIM, maxWidth: '650px', fontWeight: 300 }}>
              I use AI tools daily — Claude Code for infrastructure, code review, and diagnostics.
              My workflow is AI-augmented, not AI-dependent. Every PR is human-reviewed, every architecture
              decision is mine. The result: faster delivery, fewer issues, higher quality.
            </p>
          </div>
        </div>

        <div>
          <h2 style={{ fontSize: '0.8rem', fontWeight: 500, color: ACCENT, textTransform: 'uppercase', letterSpacing: '0.15em', marginBottom: '1.5rem' }}>Get in Touch</h2>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1.5rem', alignItems: 'center' }}>
            <a href="mailto:mark@camelcase.club" style={{ color: TEXT, textDecoration: 'none', fontSize: '0.95rem', fontWeight: 400 }}>mark@camelcase.club</a>
            <a href="https://github.com/mm-camelcase" style={{ color: TEXT, textDecoration: 'none', fontSize: '0.95rem', fontWeight: 400 }}>GitHub</a>
            <a href="#" style={{ color: TEXT, textDecoration: 'none', fontSize: '0.95rem', fontWeight: 400 }}>LinkedIn</a>
            <span style={{
              padding: '0.35rem 1rem', borderRadius: '20px',
              background: 'rgba(52, 211, 153, 0.1)', border: '1px solid rgba(52, 211, 153, 0.2)',
              color: '#34d399', fontSize: '0.8rem', fontWeight: 500,
            }}>
              Available for new engagements
            </span>
          </div>
        </div>
      </section>

      <footer style={{
        position: 'relative', zIndex: 1, maxWidth: '1100px', margin: '0 auto',
        padding: '2rem', borderTop: `1px solid ${GLASS_BORDER}`,
        fontSize: '0.8rem', color: TEXT_DIM, fontWeight: 300,
      }}>
        Camelcase Ltd. — {new Date().getFullYear()}
      </footer>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(AmbientPrototype));
  </script>
</body>
</html>
